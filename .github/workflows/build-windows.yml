name: Build Windows
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Install Qt properly for Windows (using MSVC compiler)
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.0' # Match your Qt version
          arch: 'win64_msvc2019_64' # Forces the Windows MSVC architecture
# 2. Set up the MSVC Developer Command Prompt
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # 3. Configure and Build using Ninja
      - name: Build Project
        run: |
          # We change the generator (-G) to Ninja, which uses the MSVC compiler we set up above
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release .
          cmake --build build

    # 4. Deploy Qt Dependencies
      - name: Deploy Qt Dependencies
        run: |
          windeployqt build/untitled.exe

      # 5. Upload the working Windows Build
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: build/Release/
