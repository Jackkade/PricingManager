name: Build Windows Executable

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2' # Use your specific Qt version
        target: 'desktop'
# 3. Configure and Build (Completely replaces the old mkdir/cd steps)
    - name: Build Project
      run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 .
          cmake --build build --config Release

      # 4. Deploy Qt Dependencies (Updated to point to the new build folder location)
    - name: Deploy Qt Dependencies
      run: |
          windeployqt build/Release/untitled.exe
    - name: Package Output
      shell: pwsh
      run: |
        # Use windeployqt to grab dependencies (windeployqt is located in your Qt install path)
        & C:\Qt\6.7.2\msvc2019_64\bin\windeployqt.exe --release build\Release\your_app.exe
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Windows-App
        path: build/Release/
